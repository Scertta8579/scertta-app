<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Opción 3: Pin + Ruta — el camino y el destino en un solo trazo -->
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64DEB2"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Sombra elegante -->
  <ellipse cx="115" cy="175" rx="55" ry="8" fill="#64DEB2" opacity="0.08"/>
  <!-- Cuerpo del pin estilizado -->
  <path d="M100 16 Q150 16 155 72 Q160 115 130 142 Q110 165 100 178 Q90 165 70 142 Q40 115 45 72 Q50 16 100 16Z" fill="url(#g3)"/>
  <!-- Ruta interior (la "R" invisible nace del camino) -->
  <path d="M100 56 L100 132" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 90 Q123 88 130 72" stroke="#0F172A" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Punto de origen -->
  <circle cx="100" cy="56" r="5" fill="#0F172A"/>
  <!-- Punto de destino -->
  <circle cx="100" cy="132" r="5" fill="#64DEB2"/>
</svg>
