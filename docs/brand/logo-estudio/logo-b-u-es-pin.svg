<svg width="400" height="90" viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
  <!-- Opción B: La "u" es el pin — la letra misma tiene forma de ubicación -->
  <defs>
    <linearGradient id="ugrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64DEB2"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- R normal -->
  <path d="M18 20 L18 75" stroke="#0F172A" stroke-width="9" stroke-linecap="square"/>
  <path d="M18 20 Q56 20 58 40 Q60 56 40 56 L18 56" fill="none" stroke="#0F172A" stroke-width="9" stroke-linecap="square"/>
  <path d="M36 56 L66 75" stroke="#0F172A" stroke-width="9" stroke-linecap="square"/>
  <!-- u = pin estilizado: la base de la u es la aguja, los brazos son el cuerpo del pin -->
  <path d="M82 20 L82 48 Q82 68 100 72 Q118 68 118 48 L118 20" fill="none" stroke="url(#ugrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Aguja del pin (debajo de la u) -->
  <line x1="100" y1="68" x2="100" y2="85" stroke="url(#ugrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Punto de destino -->
  <circle cx="100" cy="85" r="4" fill="#34D399"/>
  <!-- t m y -->
  <text x="132" y="68" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="58" fill="#0F172A" letter-spacing="3">t</text>
  <text x="162" y="68" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="58" fill="#0F172A" letter-spacing="3">m</text>
  <text x="220" y="68" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="58" fill="#0F172A" letter-spacing="3">y</text>
</svg>
