# PostgreSQL Host-Based Authentication
# Rutmy Local — Permite conexiones locales + red local + replicación
# =============================================================================

# TYPE  DATABASE  USER      ADDRESS          METHOD
local   all       all                        trust
host    all       all       127.0.0.1/32     md5
host    all       all       192.168.0.0/24   md5
host    all       all       10.0.0.0/8       md5

# Replication connections
host    replication  all   127.0.0.1/32      md5
host    replication  all   192.168.0.0/24    md5

# Supabase Cloud — replication connection (password in connection string)
host    all          all   0.0.0.0/0         md5
host    replication  all   0.0.0.0/0         md5
