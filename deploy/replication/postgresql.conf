# =============================================================================
# postgresql.conf — Rutmy Local PostgreSQL 17
# Optimizado para: ZimaOS (ARM64, 19GB RAM, 4 cores)
# Rol: Primary write target + logical replication subscriber
# =============================================================================

# ── Connections ──
listen_addresses = '*'
port = 5433
max_connections = 100
superuser_reserved_connections = 3

# ── Memory (19GB total, ~4GB for PostgreSQL) ──
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 64MB
maintenance_work_mem = 256MB

# ── WAL / Replication ──
wal_level = logical
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 1GB
max_wal_size = 2GB
min_wal_size = 256MB

# ── Write-Ahead Log ──
wal_buffers = 16MB
synchronous_commit = off          # Async para latencia mínima local
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# ── Planner ──
random_page_cost = 1.1            # SSD/NVMe
effective_io_concurrency = 200
default_statistics_target = 100

# ── Autovacuum ──
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ── Logging ──
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p] %u@%d '

# ── Replication-specific ──
hot_standby = on
hot_standby_feedback = on
max_standby_streaming_delay = 30s
max_standby_archive_delay = 60s

# ── Subscription tuning ──
max_logical_replication_workers = 4
max_sync_workers_per_subscription = 2
