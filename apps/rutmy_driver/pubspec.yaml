name: rutmy_drive
description: Rutmy Drive - App para Conductores
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_shared:
    path: ../../packages/flutter-shared
  

  # Supabase
  supabase_flutter: ^2.5.0
  
  # HTTP para llamar a Edge Functions
  http: ^1.2.0
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  
  # Mapas
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  
  # UI
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Cámara y archivos
  image_picker: ^1.0.7
  device_info_plus: ^11.2.0

  # Permisos (onboarding de seguridad; sin solicitar en el botón de pánico)
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_shared:
    path: ../../packages/flutter-shared
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
