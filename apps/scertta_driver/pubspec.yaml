name: scertta_driver
description: Scertta Driver - App para Conductores
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # HTTP para llamar a Edge Functions
  http: ^1.2.0
  
  # Mapas
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  
  # UI
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Cámara y archivos
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
